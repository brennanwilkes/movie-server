[Unit]
# Drop-in for docker.service — the movie stack must never start without the media drive.
#
# Every container is `restart: unless-stopped`, so after ANY reboot dockerd brings the
# whole stack up on its own. deploy.sh (and therefore ensure-data.sh) does not run on
# boot, so the fail-closed check in ensure-data.sh does not cover that path: with the
# drive unplugged, Jellyfin/qBittorrent/Radarr/Sonarr would bind-mount the boot SSD's
# empty /data and start writing media and torrents there.
#
# Requiring the gate unit makes docker.service fail to start instead, which means no
# container runs at all. To use the box without the drive, stop it deliberately:
#     make down && sudo systemctl stop docker
Requires=media-drive-gate.service
After=media-drive-gate.service